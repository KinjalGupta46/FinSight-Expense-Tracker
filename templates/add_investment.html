{% extends "base.html" %}

{% block title %}Add Investment{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add Investment</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Investment Name</label>
                    <input
                        type="text"
                        name="investment_name"
                        class="form-control"
                        placeholder="Reliance, SBI, Gold..."
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Investment Type</label>

                    <select
                        name="investment_type"
                        class="form-select"
                        required>

                        <option value="">Select Type</option>
                        <option>Stock</option>
                        <option>Mutual Fund</option>
                        <option>ETF</option>
                        <option>Bond</option>
                        <option>Gold</option>

                    </select>

                </div>

                <div class="mb-3">
                    <label class="form-label">Quantity</label>

                    <input
                        type="number"
                        name="quantity"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Purchase Price</label>

                    <input
                        type="number"
                        step="0.01"
                        name="purchase_price"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Current Price</label>

                    <input
                        type="number"
                        step="0.01"
                        name="current_price"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Purchase Date</label>

                    <input
                        type="date"
                        name="purchase_date"
                        class="form-control"
                        required>
                </div>

                <button class="btn btn-success">
                    Add Investment
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
