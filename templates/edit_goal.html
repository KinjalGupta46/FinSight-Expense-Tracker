{% extends "base.html" %}

{% block title %}Edit Goal{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-warning">
            <h3>Edit Financial Goal</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Goal Name</label>
                    <input type="text"
                           name="goal_name"
                           class="form-control"
                           value="{{ goal[0] }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Target Amount</label>
                    <input type="number"
                           step="0.01"
                           name="target_amount"
                           class="form-control"
                           value="{{ goal[1] }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Saved Amount</label>
                    <input type="number"
                           step="0.01"
                           name="saved_amount"
                           class="form-control"
                           value="{{ goal[2] }}"
                           required>
                </div>

                <div class="mb-3">
                    <label>Deadline</label>
                    <input type="date"
                           name="deadline"
                           class="form-control"
                           value="{{ goal[3] }}"
                           required>
                </div>

                <button class="btn btn-success">
                    Update Goal
                </button>

                <a href="/goals" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
