{% extends "base.html" %}

{% block title %}Add Goal{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3>Add Financial Goal</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Goal Name</label>

                    <input
                        type="text"
                        name="goal_name"
                        class="form-control"
                        placeholder="House, Car, Vacation..."
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Target Amount</label>

                    <input
                        type="number"
                        step="0.01"
                        name="target_amount"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Saved Amount</label>

                    <input
                        type="number"
                        step="0.01"
                        name="saved_amount"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Deadline</label>

                    <input
                        type="date"
                        name="deadline"
                        class="form-control"
                        required>
                </div>

                <button class="btn btn-success">
                    Add Goal
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
